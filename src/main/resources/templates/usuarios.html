<div th:replace="~{layout :: layout(~{::section})}">
    <section>
        <div class="row g-4">
            <!-- Registrar Usuario (RF04) -->
            <div class="col-lg-4">
                <div class="card card-custom border-0 shadow-sm">
                    <div class="card-header bg-white py-3 border-0">
                        <h5 class="mb-0 fw-semibold text-secondary">
                            <i class="bi bi-person-plus-fill me-2 text-success"></i>Registrar Usuario (RF04)
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/usuarios/registrar}" th:object="${nuevoUsuario}" method="post">
                            <div class="mb-3">
                                <label for="codigoUsuario" class="form-label small fw-medium">Código de Usuario</label>
                                <input type="text" id="codigoUsuario" th:field="*{codigo}" class="form-control rounded-3" placeholder="Ej. U01" required>
                            </div>
                            <div class="mb-3">
                                <label for="nombreUsuario" class="form-label small fw-medium">Nombre Completo</label>
                                <input type="text" id="nombreUsuario" th:field="*{nombre}" class="form-control rounded-3" placeholder="Ej. Juan Pérez" required>
                            </div>
                            <div class="mb-3">
                                <label for="emailUsuario" class="form-label small fw-medium">Correo Electrónico</label>
                                <input type="email" id="emailUsuario" th:field="*{email}" class="form-control rounded-3" placeholder="Ej. juan.perez@email.com" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 rounded-3 py-2 btn-custom">
                                <i class="bi bi-save me-1"></i>Registrar Usuario
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Buscar y Listar Usuarios (RF05) -->
            <div class="col-lg-8">
                <div class="card card-custom border-0 shadow-sm">
                    <div class="card-header bg-white py-3 border-0 d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
                        <h5 class="mb-0 fw-semibold text-secondary">
                            <i class="bi bi-people-fill me-2 text-info"></i>Listado de Usuarios (RF05)
                        </h5>
                        <!-- Search Form (RF05) -->
                        <form th:action="@{/usuarios}" method="get" class="d-flex align-items-center gap-2">
                            <div class="input-group input-group-sm">
                                <input type="text" name="query" th:value="${query}" class="form-control rounded-start-pill" placeholder="Buscar por código o nombre..." style="min-width: 200px;">
                                <button class="btn btn-success rounded-end-pill px-3" type="submit">
                                    <i class="bi bi-search"></i>
                                </button>
                            </div>
                            <a th:if="${query != null and !query.isEmpty()}" th:href="@{/usuarios}" class="btn btn-outline-secondary btn-sm rounded-circle" title="Limpiar búsqueda">
                                <i class="bi bi-x-lg"></i>
                            </a>
                        </form>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Código</th>
                                        <th>Nombre Completo</th>
                                        <th>Correo Electrónico</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="usuario : ${usuarios}">
                                        <td class="ps-4 fw-semibold text-success" th:text="${usuario.codigo}">U01</td>
                                        <td class="fw-semibold" th:text="${usuario.nombre}">Juan Pérez</td>
                                        <td th:text="${usuario.email}">juan.perez@email.com</td>
                                    </tr>
                                    <tr th:if="${usuarios.isEmpty()}">
                                        <td colspan="3" class="text-center py-5 text-muted">
                                            <i class="bi bi-person-x-fill fs-3 d-block mb-2"></i>
                                            No se encontraron usuarios.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
