<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Inteligente</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .sidebar {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #cbd5e1;
            min-height: 100vh;
        }
        .sidebar .nav-link {
            color: #cbd5e1;
            padding: 0.8rem 1.5rem;
            border-radius: 0.375rem;
            margin: 0.2rem 1rem;
            transition: all 0.2s ease;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .sidebar .nav-link.active {
            background-color: #3b82f6;
            font-weight: 500;
        }
        .main-content {
            flex: 1;
            padding: 2rem;
        }
        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .gradient-card-1 {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
        }
        .gradient-card-2 {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: white;
        }
        .gradient-card-3 {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }
        .table-responsive {
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }
        .table thead {
            background-color: #f9fafb;
        }
        .btn-custom {
            border-radius: 0.5rem;
            padding: 0.5rem 1.25rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 px-0 sidebar d-flex flex-column position-fixed" style="height: 100vh; overflow-y: auto; z-index: 1000;">
                <div class="py-4 px-4 text-center border-bottom border-secondary mb-3">
                    <h5 class="mb-0 text-white fw-bold">
                        <i class="bi bi-book-half me-2 text-primary"></i>BiblioWeb
                    </h5>
                    <span class="badge bg-primary mt-2">MVP Web</span>
                </div>
                <ul class="nav flex-column mb-auto">
                    <li class="nav-item">
                        <a th:href="@{/}" class="nav-link" th:classappend="${requestURI == '/' or requestURI == ''} ? 'active' : ''">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/libros}" class="nav-link" th:classappend="${#strings.startsWith(requestURI, '/libros')} ? 'active' : ''">
                            <i class="bi bi-journal-text me-2"></i> Libros
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/usuarios}" class="nav-link" th:classappend="${#strings.startsWith(requestURI, '/usuarios')} ? 'active' : ''">
                            <i class="bi bi-people me-2"></i> Usuarios
                        </a>
                    </li>
                    <li class="nav-item">
                        <a th:href="@{/prestamos}" class="nav-link" th:classappend="${#strings.startsWith(requestURI, '/prestamos')} ? 'active' : ''">
                            <i class="bi bi-arrow-left-right me-2"></i> Préstamos
                        </a>
                    </li>
                </ul>
                <div class="p-3 text-center border-top border-secondary text-muted small">
                    PS_Lab05 - 2026
                </div>
            </div>

            <!-- Spacer for fixed sidebar -->
            <div class="col-md-3 col-lg-2 px-0"></div>

            <!-- Main Content Area -->
            <div class="col-md-9 col-lg-10 px-0 d-flex flex-column min-vh-100">
                <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3">
                    <div class="container-fluid px-0">
                        <span class="navbar-brand mb-0 h1 fs-5 fw-semibold">Gestión de Biblioteca Inteligente</span>
                        <div class="d-flex align-items-center">
                            <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i> <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></span></span>
                        </div>
                    </div>
                </nav>

                <main class="main-content">
                    <!-- Notifications -->
                    <div class="container-fluid px-0 mb-4" th:if="${successMessage}">
                        <div class="alert alert-success alert-dismissible fade show border-0 shadow-sm" role="alert" style="border-left: 4px solid #10b981 !important;">
                            <i class="bi bi-check-circle-fill me-2"></i>
                            <span th:text="${successMessage}">Mensaje de éxito</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    </div>
                    <div class="container-fluid px-0 mb-4" th:if="${errorMessage}">
                        <div class="alert alert-danger alert-dismissible fade show border-0 shadow-sm" role="alert" style="border-left: 4px solid #ef4444 !important;">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}">Mensaje de error</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    </div>

                    <!-- Page content will be inserted here -->
                    <div th:insert="${content}"></div>
                </main>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
